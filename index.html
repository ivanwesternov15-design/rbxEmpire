<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070D13">
<title>Rbx Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles/variables.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/navigation.css">
<link rel="stylesheet" href="styles/home.css">
<link rel="stylesheet" href="styles/sections.css">
</head>
<body>
  <div id="splash">
    <div class="splash-cards">
      <span class="splash-card c1"></span>
      <span class="splash-card c2"></span>
      <span class="splash-card c3"></span>
    </div>
    <div class="splash-logo">Rbx<span>Game</span></div>
    <div class="splash-bar"><i></i></div>
  </div>

  <div id="app">
    <header id="topbar" class="topbar hidden">
      <div class="topbar-inner">
        <div id="topbar-avatar"></div>
        <div class="topbar-info">
          <div id="topbar-name" class="topbar-name"></div>
          <div id="topbar-username" class="topbar-id"></div>
        </div>
        <div class="topbar-bals" id="topbar-bals"></div>
        <button class="icon-btn hist-btn" id="topbar-history" title="История">
          <span class="hist-btn-icon" id="hist-btn-icon"></span>
          <span class="hist-badge" id="hist-badge" hidden></span>
        </button>
      </div>
    </header>

    <main id="content" class="content">
      <section id="sec-home" class="section"></section>
      <section id="sec-cards" class="section"></section>
      <section id="sec-referrals" class="section"></section>
      <section id="sec-tasks" class="section"></section>
      <section id="sec-profile" class="section"></section>
    </main>

    <nav id="bottomnav" class="bottomnav">
      <div class="bottomnav-indicator" id="nav-indicator"></div>
      <button class="nav-item" data-section="home" data-i18n="nav.home"></button>
      <button class="nav-item" data-section="cards" data-i18n="nav.cards"></button>
      <button class="nav-item" data-section="referrals" data-i18n="nav.referrals"></button>
      <button class="nav-item" data-section="tasks" data-i18n="nav.tasks"></button>
      <button class="nav-item" data-section="profile" data-i18n="nav.profile"></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <div id="popup-root"></div>

  <script src="scripts/cache.js"></script>
  <script src="scripts/icons.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/telegram.js"></script>
  <script src="scripts/api.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/ui.js"></script>
  <script src="scripts/navigation.js"></script>
  <script src="scripts/views/home.js"></script>
  <script src="scripts/views/cards.js"></script>
  <script src="scripts/views/referrals.js"></script>
  <script src="scripts/views/tasks.js"></script>
  <script src="scripts/views/profile.js"></script>
  <script src="scripts/views/admin.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
